<!doctype html>

<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Linkhub — cepat & sederhana</title>
  <meta name="description" content="Profil link sederhana seperti Linktree — ultra cepat, single-file HTML." />
  <!-- Critical inline CSS (small, no external files) -->
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef6}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;line-height:1.3;background:linear-gradient(180deg,#06111a 0%,#071827 100%);color:var(--text);-webkit-font-smoothing:antialiased}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{width:100%;max-width:520px;background:rgba(255,255,255,0.03);padding:28px;border-radius:14px;backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(2,6,23,0.6)}
    .head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
    .avatar{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7c3aed);flex:0 0 72px}
    .title{font-size:18px;font-weight:700;margin:0}
    .subtitle{margin:0;font-size:13px;opacity:0.8}.links{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.link{display:block;text-decoration:none;padding:14px 16px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);font-weight:600;color:var(--text);transition:transform .12s ease, box-shadow .12s ease}
.link:active{transform:translateY(1px)}
.link:hover{box-shadow:0 6px 18px rgba(0,0,0,0.45)}
.small{font-size:13px;opacity:0.82}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer}

footer{margin-top:18px;font-size:12px;color:rgba(230,238,246,0.7);text-align:center}

/* responsive */
@media (max-width:420px){.card{padding:18px}.title{font-size:16px}.avatar{width:60px;height:60px}}

  </style>
  <!-- Minimal script, deferred to avoid blocking rendering -->
  <script defer>
    // tiny helpers: copy profile url / update dynamic content
    window.addEventListener('DOMContentLoaded',()=>{
      const copyBtn=document.getElementById('copy');
      if(copyBtn){
        copyBtn.addEventListener('click',async()=>{
          try{
            await navigator.clipboard.writeText(location.href);
            copyBtn.textContent='Tersalin ✓';
            setTimeout(()=>copyBtn.textContent='Salin link',1600);
          }catch(e){
            alert('Gagal menyalin — gunakan salin manual.');
          }
        });
      }// Progressive enhancement: replace data-link attributes with real hrefs (prevents layout shift)
  document.querySelectorAll('[data-link]').forEach(a=>{a.href=a.dataset.link});
});

  </script>
  <!-- No external fonts, no third-party scripts -> keep requests = 0 -->
</head>
<body>
  <main class="wrap">
    <section class="card" role="region" aria-label="Profil link">
      <header class="head">
        <div class="avatar" aria-hidden="true">
          <!-- inline SVG logo (no external request) -->
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="24" height="24" rx="5" fill="url(#g)"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs></svg>
        </div>
        <div>
          <h1 class="title">Nama Kamu</h1>
          <p class="subtitle">Satu tempat untuk semua link — deskripsi singkat.</p>
        </div>
      </header><nav class="links" aria-label="Daftar tautan">
    <!-- Use data-link to avoid blocking render; JS will set actual hrefs -->
    <a class="link" data-link="https://example.com/1" target="_blank" rel="noopener" aria-label="Tautan 1">🔗 Tautan penting</a>
    <a class="link" data-link="https://example.com/2" target="_blank" rel="noopener" aria-label="Tautan 2">💼 Portofolio</a>
    <a class="link" data-link="https://example.com/3" target="_blank" rel="noopener" aria-label="Tautan 3">📝 Blog</a>
    <a class="link" data-link="mailto:you@example.com" aria-label="Email">✉️ Kontak</a>
  </nav>

  <div class="controls">
    <button id="copy" class="btn">Salin link</button>
    <a class="btn" href="#footer" role="button">Tentang</a>
  </div>

  <footer id="footer">
    <div class="small">Dibuat dengan hati — bebas iklan. Tips optimasi: gunakan CDN + kompresi.</div>
  </footer>
</section>

  </main>
</body>
</html>
